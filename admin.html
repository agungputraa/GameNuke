<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Nuke — Enterprise VIP Admin Command Center</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            nuke: {
              void: '#060a08',
              surface: '#0c1410',
              card: '#101a15',
              cardHover: '#14221c',
              border: '#1a2b22',
              emerald: '#10b981',
              cyan: '#06b6d4',
              gold: '#f59e0b',
              danger: '#ef4444'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Alpine.js CDN (defer) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #060a08; }
    ::-webkit-scrollbar-thumb { background: #1a2b22; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    .glow-emerald { box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.25); }
    .glow-gold { box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.25); }
    .glow-cyan { box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25); }
  </style>
</head>

<body class="bg-nuke-void text-slate-100 font-sans min-h-screen antialiased selection:bg-nuke-emerald selection:text-black"
      x-data="adminApp()" x-init="initApp()" x-cloak>

  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- TOAST NOTIFICATIONS                                                       -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-2xl backdrop-blur-md transition-all duration-300 transform translate-y-0"
           :class="{
             'bg-emerald-950/90 border-emerald-500/50 text-emerald-200': toast.type === 'success',
             'bg-rose-950/90 border-rose-500/50 text-rose-200': toast.type === 'error',
             'bg-amber-950/90 border-amber-500/50 text-amber-200': toast.type === 'warning',
             'bg-cyan-950/90 border-cyan-500/50 text-cyan-200': toast.type === 'info'
           }">
        <i class="fa-solid text-sm"
           :class="{
             'fa-circle-check text-emerald-400': toast.type === 'success',
             'fa-circle-xmark text-rose-400': toast.type === 'error',
             'fa-triangle-exclamation text-amber-400': toast.type === 'warning',
             'fa-circle-info text-cyan-400': toast.type === 'info'
           }"></i>
        <span class="text-xs font-semibold" x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- LOGIN VIEW (SHOWN WHEN NOT AUTHENTICATED)                                -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <template x-if="!isLoggedIn">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-nuke-surface border border-nuke-border rounded-2xl p-8 glow-emerald relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-nuke-emerald/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-nuke-cyan/10 rounded-full blur-3xl"></div>
        
        <div class="flex items-center gap-3 mb-6">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500/20 to-cyan-500/20 border border-nuke-emerald/40 flex items-center justify-center text-nuke-emerald text-xl">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <h1 class="text-xl font-black tracking-wider text-white">GAME NUKE</h1>
            <p class="text-[11px] font-mono tracking-widest text-nuke-emerald uppercase">Enterprise VIP Command Center</p>
          </div>
        </div>

        <form @submit.prevent="login()" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Admin Username</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">
                <i class="fa-solid fa-user"></i>
              </span>
              <input type="text" x-model="loginForm.username" required
                     class="w-full pl-10 pr-4 py-2.5 bg-nuke-void border border-nuke-border rounded-xl text-sm font-mono text-white placeholder-slate-600 focus:outline-none focus:border-nuke-emerald transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input type="password" x-model="loginForm.password" required
                     class="w-full pl-10 pr-4 py-2.5 bg-nuke-void border border-nuke-border rounded-xl text-sm font-mono text-white placeholder-slate-600 focus:outline-none focus:border-nuke-emerald transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Backend Worker Endpoint</label>
            <input type="url" x-model="workerUrl"
                   class="w-full px-3.5 py-2 bg-nuke-void border border-nuke-border rounded-xl text-xs font-mono text-slate-300 focus:outline-none focus:border-nuke-emerald transition">
          </div>

          <button type="submit" :disabled="loading"
                  class="w-full py-3 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 font-bold text-sm rounded-xl tracking-wider transition duration-200 flex items-center justify-center gap-2 mt-6 shadow-lg shadow-emerald-500/20 disabled:opacity-50">
            <template x-if="loading"><i class="fa-solid fa-spinner fa-spin"></i></template>
            <template x-if="!loading"><i class="fa-solid fa-right-to-bracket"></i></template>
            <span>AUTHENTICATE COMMAND CENTER</span>
          </button>
        </form>
      </div>
    </div>
  </template>

  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- MAIN ADMIN DASHBOARD                                                      -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <template x-if="isLoggedIn">
    <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
      
      <!-- Top Navigation Header -->
      <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 bg-nuke-surface border border-nuke-border rounded-2xl glow-emerald">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-500/20 to-cyan-500/20 border border-nuke-emerald/40 flex items-center justify-center text-nuke-emerald text-lg">
            <i class="fa-solid fa-bolt-lightning"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-black tracking-wide text-white">GAME NUKE</h1>
              <span class="px-2 py-0.5 text-[10px] font-mono font-bold uppercase rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">v3.2 VIP</span>
            </div>
            <p class="text-xs font-mono text-slate-400">Enterprise Mission Control &bull; Full CRUD</p>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex items-center flex-wrap gap-1 bg-nuke-void p-1.5 rounded-xl border border-nuke-border text-xs font-semibold">
          <button @click="activeTab = 'overview'"
                  :class="activeTab === 'overview' ? 'bg-nuke-emerald text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Overview</span>
          </button>
          <button @click="activeTab = 'devices'; fetchDevices()"
                  :class="activeTab === 'devices' ? 'bg-nuke-emerald text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <i class="fa-solid fa-mobile-screen"></i>
            <span>Devices &amp; VIP</span>
          </button>
          <button @click="activeTab = 'booster'; fetchBoosterFeatures()"
                  :class="activeTab === 'booster' ? 'bg-nuke-emerald text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <i class="fa-solid fa-sliders"></i>
            <span>Booster Maintenance</span>
          </button>
          <button @click="activeTab = 'orders'; fetchOrders()"
                  :class="activeTab === 'orders' ? 'bg-nuke-emerald text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <i class="fa-solid fa-receipt"></i>
            <span>Orders</span>
          </button>
          <button @click="activeTab = 'settings'"
                  :class="activeTab === 'settings' ? 'bg-nuke-emerald text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'"
                  class="px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </button>
        </nav>

        <!-- Right User Actions -->
        <div class="flex items-center gap-2">
          <button @click="refreshCurrentTab()" class="p-2 rounded-xl bg-nuke-void hover:bg-nuke-card text-slate-400 hover:text-white border border-nuke-border transition" title="Refresh Data">
            <i class="fa-solid fa-arrows-rotate text-sm" :class="{'fa-spin': loading}"></i>
          </button>
          <button @click="logout()" class="px-3 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Logout</span>
          </button>
        </div>
      </header>

      <!-- ═════════════════════════════════════════════════════════════════════ -->
      <!-- TAB 1: OVERVIEW & METRICS                                             -->
      <!-- ═════════════════════════════════════════════════════════════════════ -->
      <div x-show="activeTab === 'overview'" class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Stat 1 -->
          <div class="p-5 bg-nuke-surface border border-nuke-border rounded-2xl glow-emerald relative overflow-hidden">
            <div class="flex items-center justify-between text-slate-400 text-xs font-semibold uppercase tracking-wider">
              <span>Active VIPs</span>
              <i class="fa-solid fa-crown text-nuke-emerald"></i>
            </div>
            <div class="text-3xl font-mono font-black text-nuke-emerald mt-3" x-text="stats.activeVip || 0"></div>
            <p class="text-[11px] text-slate-400 mt-1 font-mono">Real-time unexpired subscribers</p>
          </div>

          <!-- Stat 2 -->
          <div class="p-5 bg-nuke-surface border border-nuke-border rounded-2xl glow-cyan relative overflow-hidden">
            <div class="flex items-center justify-between text-slate-400 text-xs font-semibold uppercase tracking-wider">
              <span>Total Registered Devices</span>
              <i class="fa-solid fa-mobile-screen-button text-cyan-400"></i>
            </div>
            <div class="text-3xl font-mono font-black text-cyan-400 mt-3" x-text="stats.totalDevices || 0"></div>
            <p class="text-[11px] text-slate-400 mt-1 font-mono">Unique HWID fingerprints</p>
          </div>

          <!-- Stat 3 -->
          <div class="p-5 bg-nuke-surface border border-nuke-border rounded-2xl glow-gold relative overflow-hidden">
            <div class="flex items-center justify-between text-slate-400 text-xs font-semibold uppercase tracking-wider">
              <span>Total QRIS Orders</span>
              <i class="fa-solid fa-receipt text-amber-400"></i>
            </div>
            <div class="text-3xl font-mono font-black text-amber-400 mt-3" x-text="stats.totalOrders || 0"></div>
            <p class="text-[11px] text-slate-400 mt-1 font-mono">Lifetime payment attempts</p>
          </div>

          <!-- Stat 4 -->
          <div class="p-5 bg-nuke-surface border border-nuke-border rounded-2xl relative overflow-hidden">
            <div class="flex items-center justify-between text-slate-400 text-xs font-semibold uppercase tracking-wider">
              <span>Gateway Mode</span>
              <i class="fa-solid fa-network-wired text-slate-400"></i>
            </div>
            <div class="mt-3 flex items-center gap-2">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black uppercase font-mono"
                    :class="stats.gatewayMode === 'production' ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/40' : 'bg-amber-500/15 text-amber-400 border border-amber-500/40'">
                <span class="w-2 h-2 rounded-full" :class="stats.gatewayMode === 'production' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400 animate-pulse'"></span>
                <span x-text="stats.gatewayMode || 'production'"></span>
              </span>
            </div>
            <p class="text-[11px] text-slate-400 mt-2 font-mono">Pakasir QRIS Gateway State</p>
          </div>
        </div>

        <!-- Quick Action Panels -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="p-6 bg-nuke-surface border border-nuke-border rounded-2xl space-y-4">
            <div class="flex items-center gap-2 text-sm font-bold text-white uppercase tracking-wider">
              <i class="fa-solid fa-bolt text-nuke-emerald"></i>
              <span>Quick VIP Grant</span>
            </div>
            <p class="text-xs text-slate-400">Instant VIP privilege activation for user assistance, beta testers, or manual bank transfers.</p>
            <div class="flex flex-col sm:flex-row gap-2">
              <input type="text" x-model="quickGrantId" placeholder="Enter Device ID..."
                     class="flex-1 px-3.5 py-2 bg-nuke-void border border-nuke-border rounded-xl text-xs font-mono text-white placeholder-slate-600 focus:outline-none focus:border-nuke-emerald">
              <select x-model="quickGrantDays" class="px-3 py-2 bg-nuke-void border border-nuke-border rounded-xl text-xs font-mono text-white focus:outline-none">
                <option value="7">7 Days</option>
                <option value="30">30 Days</option>
                <option value="180">180 Days</option>
                <option value="365">365 Days</option>
                <option value="9999">Lifetime VIP</option>
              </select>
              <button @click="submitQuickGrant()" class="px-4 py-2 bg-nuke-emerald hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl tracking-wider transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-crown"></i>
                <span>Grant</span>
              </button>
            </div>
          </div>

          <div class="p-6 bg-nuke-surface border border-nuke-border rounded-2xl space-y-4">
            <div class="flex items-center gap-2 text-sm font-bold text-white uppercase tracking-wider">
              <i class="fa-solid fa-tower-broadcast text-cyan-400"></i>
              <span>Emergency Maintenance Killswitch</span>
            </div>
            <p class="text-xs text-slate-400">Quickly freeze all floating booster components globally if a rogue Android update breaks input injection.</p>
            <div class="flex items-center justify-between p-3 bg-nuke-void rounded-xl border border-nuke-border">
              <div class="text-xs">
                <span class="font-bold text-white">Emergency Broadcast Banner</span>
                <p class="text-[11px] text-slate-400" x-text="boosterFeatures.emergency_broadcast.active ? 'Active on all devices' : 'Disabled / Normal operation'"></p>
              </div>
              <button @click="toggleEmergencyBroadcast()"
                      :class="boosterFeatures.emergency_broadcast.active ? 'bg-rose-500 hover:bg-rose-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'"
                      class="px-4 py-1.5 rounded-lg text-xs font-bold transition">
                <span x-text="boosterFeatures.emergency_broadcast.active ? 'DEACTIVATE' : 'ACTIVATE'"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ═════════════════════════════════════════════════════════════════════ -->
      <!-- TAB 2: DEVICE & VIP MANAGEMENT (FULL CRUD)                            -->
      <!-- ═════════════════════════════════════════════════════════════════════ -->
      <div x-show="activeTab === 'devices'" class="space-y-4">
        <!-- Control Bar -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 p-4 bg-nuke-surface border border-nuke-border rounded-2xl">
          <div class="flex items-center gap-2 flex-1 max-w-md">
            <div class="relative w-full">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input type="text" x-model="deviceSearch" placeholder="Search Device ID or Plan..."
                     class="w-full pl-9 pr-3 py-2 bg-nuke-void border border-nuke-border rounded-xl text-xs font-mono text-white placeholder-slate-600 focus:outline-none focus:border-nuke-emerald">
            </div>
            <select x-model="deviceFilter" class="px-3 py-2 bg-nuke-void border border-nuke-border rounded-xl text-xs font-mono text-slate-300 focus:outline-none">
              <option value="all">All Status</option>
              <option value="active">Active VIP</option>
              <option value="expired">Expired</option>
              <option value="lifetime">Lifetime</option>
            </select>
          </div>

          <div class="flex items-center gap-2">
            <button @click="openAddDeviceModal()" class="px-4 py-2 bg-nuke-emerald hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl transition flex items-center gap-2">
              <i class="fa-solid fa-plus"></i>
              <span>Register Device</span>
            </button>
          </div>
        </div>

        <!-- Devices Table -->
        <div class="bg-nuke-surface border border-nuke-border rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-nuke-void text-slate-400 uppercase tracking-wider font-mono border-b border-nuke-border">
                <tr>
                  <th class="py-3 px-4">Device ID (HWID)</th>
                  <th class="py-3 px-4">Plan / Tier</th>
                  <th class="py-3 px-4">Status</th>
                  <th class="py-3 px-4">Expires At</th>
                  <th class="py-3 px-4">Remaining</th>
                  <th class="py-3 px-4">Notes</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-nuke-border font-mono">
                <template x-for="dev in filteredDevices" :key="dev.deviceId">
                  <tr class="hover:bg-nuke-cardHover/50 transition">
                    <td class="py-3 px-4 font-bold text-white flex items-center gap-2">
                      <i class="fa-solid fa-mobile-screen text-slate-500"></i>
                      <span x-text="dev.deviceId"></span>
                    </td>
                    <td class="py-3 px-4">
                      <span class="px-2 py-0.5 rounded text-[11px] font-bold"
                            :class="dev.planId === 'LIFETIME' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-slate-800 text-slate-300'"
                            x-text="dev.planId"></span>
                    </td>
                    <td class="py-3 px-4">
                      <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold uppercase"
                            :class="dev.status === 'active' ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/15 text-rose-400 border border-rose-500/30'">
                        <span class="w-1.5 h-1.5 rounded-full" :class="dev.status === 'active' ? 'bg-emerald-400' : 'bg-rose-400'"></span>
                        <span x-text="dev.status"></span>
                      </span>
                    </td>
                    <td class="py-3 px-4 text-slate-300" x-text="formatDate(dev.expiresAt)"></td>
                    <td class="py-3 px-4 text-slate-300">
                      <span x-text="dev.remainingDays > 5000 ? 'Permanent' : dev.remainingDays + ' Days'"></span>
                    </td>
                    <td class="py-3 px-4 text-slate-400 text-[11px] truncate max-w-[150px]" x-text="dev.notes || '-'"></td>
                    <td class="py-3 px-4 text-right">
                      <div class="inline-flex items-center gap-1.5">
                        <button @click="openEditDeviceModal(dev)" class="p-1.5 rounded-lg bg-nuke-void hover:bg-slate-800 text-slate-300 hover:text-white border border-nuke-border transition" title="Edit Device">
                          <i class="fa-solid fa-pen-to-square text-xs"></i>
                        </button>
                        <button @click="promptGrantModal(dev.deviceId)" class="p-1.5 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition" title="Extend VIP">
                          <i class="fa-solid fa-crown text-xs"></i>
                        </button>
                        <button @click="revokeVip(dev.deviceId)" class="p-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 transition" title="Revoke VIP">
                          <i class="fa-solid fa-ban text-xs"></i>
                        </button>
                        <button @click="deleteDevice(dev.deviceId)" class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 transition" title="Delete Device">
                          <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
                <template x-if="filteredDevices.length === 0">
                  <tr>
                    <td colspan="7" class="py-8 text-center text-slate-500 font-sans">
                      <i class="fa-solid fa-inbox text-2xl mb-2"></i>
                      <p>No devices found matching current filter.</p>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ═════════════════════════════════════════════════════════════════════ -->
      <!-- TAB 3: IN-GAME BOOSTER MAINTENANCE & OVERRIDE CONTROLS                -->
      <!-- ═════════════════════════════════════════════════════════════════════ -->
      <div x-show="activeTab === 'booster'" class="space-y-6">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-4 bg-nuke-surface border border-nuke-border rounded-2xl">
          <div>

  <!-- ALPINE.JS APPLICATION LOGIC                                               -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <script>
    function adminApp() {
      return {
        isLoggedIn: false,
        adminToken: localStorage.getItem('gn_admin_token') || '',
        workerUrl: localStorage.getItem('gn_worker_url') || 'https://gamenukevip.agungofficialdev.workers.dev',
        activeTab: 'overview',
        loading: false,
        savingFeatures: false,
        pingStatus: '',
        
        loginForm: { username: '', password: '' },
        quickGrantId: '',
        quickGrantDays: '30',
        
        stats: { totalDevices: 0, activeVip: 0, expiredVip: 0, totalOrders: 0, gatewayMode: 'production' },
        devices: [],
        deviceSearch: '',
        deviceFilter: 'all',
        
        orders: [],
        orderSearch: '',
        orderFilter: 'all',

        boosterFeatures: {
          version: 1,
          last_updated: '2026-09-16',
          disabled_components: [],
          disabled_panels: [],
          component_overrides: {
            touch_tuning: { enabled: true, disabled_reason: '' },
            macro_studio: { enabled: true, disabled_reason: '' },
            cyber_jukebox: { enabled: true, disabled_reason: '' },
            screen_record: { enabled: true, disabled_reason: '' },
            system_optimizer: { enabled: true, disabled_reason: '' },
            antivirus: { enabled: true, disabled_reason: '' },
            network_vpn: { enabled: true, disabled_reason: '' },
            task_manager: { enabled: true, disabled_reason: '' },
            gpu_graphics: { enabled: true, disabled_reason: '' },
            fps_lock: { enabled: true, disabled_reason: '' }
          },
          emergency_broadcast: { active: false, message: '' }
        },

        toasts: [],
        
        // Modals
        showGrantModal: false,
        grantForm: { deviceId: '', durationDays: '30', notes: '' },

        showEditModal: false,
        editForm: { deviceId: '', planId: '', expiresIso: '', notes: '' },

        showAddModal: false,
        addForm: { deviceId: '', durationDays: '30', notes: '' },

        initApp() {
          if (this.adminToken) {
            this.isLoggedIn = true;
            this.fetchStats();
            this.fetchBoosterFeatures();
          }
        },

        toast(message, type = 'success') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, message, type });
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
          }, 4000);
        },

        async login() {
          this.loading = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.loginForm)
            });
            const data = await resp.json();
            if (data.success && data.token) {
              this.adminToken = data.token;
              this.isLoggedIn = true;
              localStorage.setItem('gn_admin_token', data.token);
              localStorage.setItem('gn_worker_url', this.workerUrl);
              this.toast('Command Center Authenticated Successfully');
              this.fetchStats();
              this.fetchBoosterFeatures();
            } else {
              this.toast(data.error || 'Authentication Failed', 'error');
            }
          } catch (e) {
            this.toast(`Connection error: ${e.message}`, 'error');
          } finally {
            this.loading = false;
          }
        },

        logout() {
          this.isLoggedIn = false;
          this.adminToken = '';
          localStorage.removeItem('gn_admin_token');
          this.toast('Logged out from Command Center', 'info');
        },

        get authHeaders() {
          return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${this.adminToken}`
          };
        },

        async fetchStats() {
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/stats`, { headers: this.authHeaders });
            if (resp.status === 401) { this.logout(); return; }
            const data = await resp.json();
            if (data.success) {
              this.stats = data;
            }
          } catch (_) {}
        },

        async fetchDevices() {
          this.loading = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/devices`, { headers: this.authHeaders });
            const data = await resp.json();
            if (data.success) {
              this.devices = data.devices || [];
            }
          } catch (e) {
            this.toast(`Failed fetching devices: ${e.message}`, 'error');
          } finally {
            this.loading = false;
          }
        },

        async fetchOrders() {
          this.loading = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/orders`, { headers: this.authHeaders });
            const data = await resp.json();
            if (data.success) {
              this.orders = data.orders || [];
            }
          } catch (e) {
            this.toast(`Failed fetching orders: ${e.message}`, 'error');
          } finally {
            this.loading = false;
          }
        },

        async fetchBoosterFeatures() {
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/features`, { headers: this.authHeaders });
            const data = await resp.json();
            if (data.success && data.features) {
              this.boosterFeatures = data.features;
            }
          } catch (_) {}
        },

        async saveBoosterFeatures() {
          this.savingFeatures = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/features`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({ features: this.boosterFeatures })
            });
            const data = await resp.json();
            if (data.success) {
              this.toast('Booster maintenance features synced to live KV');
            } else {
              this.toast(data.error || 'Failed saving features', 'error');
            }
          } catch (e) {
            this.toast(`Network error: ${e.message}`, 'error');
          } finally {
            this.savingFeatures = false;
          }
        },

        toggleEmergencyBroadcast() {
          this.boosterFeatures.emergency_broadcast.active = !this.boosterFeatures.emergency_broadcast.active;
          if (this.boosterFeatures.emergency_broadcast.active && !this.boosterFeatures.emergency_broadcast.message) {
            this.boosterFeatures.emergency_broadcast.message = 'Notice: System maintenance underway. High-priority optimization engaged.';
          }
          this.saveBoosterFeatures();
        },

        downloadFeaturesJson() {
          const blob = new Blob([JSON.stringify(this.boosterFeatures, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'booster_features.json';
          a.click();
          URL.revokeObjectURL(url);
          this.toast('Exported booster_features.json');
        },

        // Quick Grant
        async submitQuickGrant() {
          if (!this.quickGrantId) {
            this.toast('Please specify Device ID', 'warning');
            return;
          }
          await this.performGrant(this.quickGrantId, this.quickGrantDays, 'Granted via Quick Command');
          this.quickGrantId = '';
        },

        // Grant Dialog
        promptGrantModal(deviceId) {
          this.grantForm = { deviceId, durationDays: '30', notes: 'VIP Extension' };
          this.showGrantModal = true;
        },

        async submitGrantModal() {
          await this.performGrant(this.grantForm.deviceId, this.grantForm.durationDays, this.grantForm.notes);
          this.showGrantModal = false;
        },

        async performGrant(deviceId, days, notes) {
          this.loading = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/grant`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({ deviceId, durationDays: Number(days), notes })
            });
            const data = await resp.json();
            if (data.success) {
              this.toast(`Granted ${days} days VIP to ${deviceId}`);
              this.fetchDevices();
              this.fetchStats();
            } else {
              this.toast(data.error || 'Failed to grant VIP', 'error');
            }
          } catch (e) {
            this.toast(e.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        // Revoke VIP
        async revokeVip(deviceId) {
          if (!confirm(`Revoke VIP access immediately for device ${deviceId}?`)) return;
          this.loading = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/revoke`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({ deviceId })
            });
            const data = await resp.json();
            if (data.success) {
              this.toast(`VIP access revoked for ${deviceId}`, 'info');
              this.fetchDevices();
              this.fetchStats();
            }
          } catch (e) {
            this.toast(e.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        // Edit Device
        openEditDeviceModal(dev) {
          const iso = dev.expiresAt ? new Date(dev.expiresAt).toISOString().slice(0, 16) : '';
          this.editForm = {
            deviceId: dev.deviceId,
            planId: dev.planId,
            expiresIso: iso,
            notes: dev.notes || ''
          };
          this.showEditModal = true;
        },

        async submitEditModal() {
          const expTime = this.editForm.expiresIso ? new Date(this.editForm.expiresIso).getTime() : 0;
          this.loading = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/device/update`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({
                deviceId: this.editForm.deviceId,
                planId: this.editForm.planId,
                expiresAt: expTime,
                notes: this.editForm.notes
              })
            });
            const data = await resp.json();
            if (data.success) {
              this.toast('Device updated successfully');
              this.showEditModal = false;
              this.fetchDevices();
              this.fetchStats();
            }
          } catch (e) {
            this.toast(e.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        // Add Device
        openAddDeviceModal() {
          this.addForm = { deviceId: '', durationDays: '30', notes: 'Manually Registered' };
          this.showAddModal = true;
        },

        async submitAddModal() {
          if (!this.addForm.deviceId) {
            this.toast('Device ID is required', 'warning');
            return;
          }
          await this.performGrant(this.addForm.deviceId, this.addForm.durationDays, this.addForm.notes);
          this.showAddModal = false;
        },

        // Delete Device
        async deleteDevice(deviceId) {
          if (!confirm(`Are you sure you want to completely purge device ${deviceId} from KV?`)) return;
          this.loading = true;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/device/delete`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({ deviceId })
            });
            const data = await resp.json();
            if (data.success) {
              this.toast(`Device ${deviceId} purged from database`, 'info');
              this.fetchDevices();
              this.fetchStats();
            }
          } catch (e) {
            this.toast(e.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        // Approve Order
        async approveOrder(orderId) {
          if (!confirm(`Manually approve order ${orderId} and grant VIP?`)) return;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/order/update`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({ orderId, status: 'completed', autoGrant: true })
            });
            const data = await resp.json();
            if (data.success) {
              this.toast(`Order ${orderId} approved and VIP granted`);
              this.fetchOrders();
              this.fetchStats();
            }
          } catch (e) {
            this.toast(e.message, 'error');
          }
        },

        // Delete Order
        async deleteOrder(orderId) {
          if (!confirm(`Delete order ${orderId}?`)) return;
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/order/delete`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({ orderId })
            });
            const data = await resp.json();
            if (data.success) {
              this.toast(`Order ${orderId} deleted`);
              this.fetchOrders();
            }
          } catch (e) {
            this.toast(e.message, 'error');
          }
        },

        // Gateway Settings
        async setGatewayMode(mode) {
          try {
            const resp = await fetch(`${this.workerUrl}/api/admin/config`, {
              method: 'POST',
              headers: this.authHeaders,
              body: JSON.stringify({ mode })
            });
            const data = await resp.json();
            if (data.success) {
              this.stats.gatewayMode = data.mode;
              this.toast(`Payment gateway switched to ${data.mode.toUpperCase()}`);
            }
          } catch (e) {
            this.toast(e.message, 'error');
          }
        },

        async testPing() {
          this.pingStatus = 'Pinging edge...';
          const t0 = performance.now();
          try {
            const resp = await fetch(`${this.workerUrl}/health`);
            const latency = Math.round(performance.now() - t0);
            if (resp.ok) {
              this.pingStatus = `Online &bull; ${latency}ms latency`;
              this.toast(`Edge responsive: ${latency}ms`);
            } else {
              this.pingStatus = 'Edge returned HTTP error';
            }
          } catch (e) {
            this.pingStatus = `Offline: ${e.message}`;
          }
        },

        refreshCurrentTab() {
          this.fetchStats();
          if (this.activeTab === 'devices') this.fetchDevices();
          if (this.activeTab === 'orders') this.fetchOrders();
          if (this.activeTab === 'booster') this.fetchBoosterFeatures();
          this.toast('Refreshed data');
        },

        // Filters
        get filteredDevices() {
          return this.devices.filter(d => {
            const matchSearch = !this.deviceSearch || 
              d.deviceId.toLowerCase().includes(this.deviceSearch.toLowerCase()) ||
              (d.planId && d.planId.toLowerCase().includes(this.deviceSearch.toLowerCase()));
            const matchFilter = this.deviceFilter === 'all' ||
              (this.deviceFilter === 'active' && d.status === 'active') ||
              (this.deviceFilter === 'expired' && d.status === 'expired') ||
              (this.deviceFilter === 'lifetime' && d.planId === 'LIFETIME');
            return matchSearch && matchFilter;
          });
        },

        get filteredOrders() {
          return this.orders.filter(o => {
            const matchSearch = !this.orderSearch ||
              o.orderId.toLowerCase().includes(this.orderSearch.toLowerCase()) ||
              (o.deviceId && o.deviceId.toLowerCase().includes(this.orderSearch.toLowerCase()));
            const matchFilter = this.orderFilter === 'all' || o.status === this.orderFilter;
            return matchSearch && matchFilter;
          });
        },

        // Component Helpers
        getComponentName(key) {
          const names = {
            touch_tuning: 'Touch Tuning & Aim Sensi',
            macro_studio: 'Macro Studio (Multi-Pin)',
            cyber_jukebox: 'Cyber Jukebox Overlay',
            screen_record: 'Screen Record Guardian',
            system_optimizer: 'System Optimizer & Cleaner',
            antivirus: 'Antivirus & Threat Scanner',
            network_vpn: 'Gaming VPN & Ping Stabilizer',
            task_manager: 'In-Game Task Manager',
            gpu_graphics: 'GPU Graphics & Shaders',
            fps_lock: 'Universal FPS Lock & Limiter'
          };
          return names[key] || key.replace(/_/g, ' ');
        },

        getComponentIcon(key) {
          const icons = {
            touch_tuning: 'fa-solid fa-hand-pointer',
            macro_studio: 'fa-solid fa-gamepad',
            cyber_jukebox: 'fa-solid fa-music',
            screen_record: 'fa-solid fa-video',
            system_optimizer: 'fa-solid fa-broom',
            antivirus: 'fa-solid fa-shield-virus',
            network_vpn: 'fa-solid fa-network-wired',
            task_manager: 'fa-solid fa-microchip',
            gpu_graphics: 'fa-solid fa-cube',
            fps_lock: 'fa-solid fa-gauge-high'
          };
          return icons[key] || 'fa-solid fa-cube';
        },

        formatDate(ts) {
          if (!ts) return '-';
          return new Date(ts).toLocaleString('id-ID', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
        },

        formatCurrency(num) {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
        }
      };
    }
  </script>
</body>
</html>
